name: Develop & Snapshot

on:
  push:
    branches:
      - "develop"

jobs:
  build-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: '1.12.6.1673'
          bb: 'latest'
      - name: Cache All The Things
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
            ~/.deps.clj
          key: ${{ runner.os }}-${{ hashFiles('**/deps.edn', '**/bb.edn') }}
      - name: Setup Databases
        run: bb docker:up
        env:
          MYSQL_ROOT_PASSWORD: testing
      - name: Run MariaDB Tests
        run: bb test maria jdk21
        env:
          MYSQL_ROOT_PASSWORD: testing
      - name: Run All Tests, then Build & Deploy Snapshot
        run: bb ci:deploy --snapshot jdk21
        env:
          MYSQL_ROOT_PASSWORD: testing
          CLOJARS_PASSWORD: ${{secrets.DEPLOY_TOKEN}}
          CLOJARS_USERNAME: ${{secrets.DEPLOY_USERNAME}}

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '11', '17', '25' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: '1.12.6.1673'
          bb: 'latest'
      - name: Cache All The Things
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.clojure
            ~/.cpcache
            ~/.deps.clj
          key: ${{ runner.os }}-${{ hashFiles('**/deps.edn', '**/bb.edn') }}
      - name: Run Tests
        run: bb test local jdk${{ matrix.java }}
