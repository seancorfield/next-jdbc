services:
  mysql:
    image: percona:5.7
    environment:
      - MYSQL_ROOT_PASSWORD
    ports:
      - "3306:3306"
    command:
      [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Str0ngP4ssw0rd
    ports:
      - "1433:1433"
  xtdb:
    #image: ghcr.io/xtdb/xtdb:latest beta8.3
    image: ghcr.io/xtdb/xtdb:2.0.0-beta8.1
    pull_policy: always
    ports:
      - "5432:5432"
